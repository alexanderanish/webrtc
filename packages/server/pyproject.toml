[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webrtc-enterprise-server"
version = "1.0.0"
description = "Enterprise-grade WebRTC server library for FastAPI"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["webrtc", "fastapi", "aiortc", "real-time", "gemini", "enterprise"]
authors = [
    {name = "Enterprise WebRTC Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.104.0",
    "aiortc>=1.6.0",
    "websockets>=12.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "av>=10.0.0",
    "numpy>=1.24.0",
    "google-generativeai>=0.3.0",
    "google-ai-generativelanguage>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/webrtc-enterprise"
Documentation = "https://webrtc-enterprise.readthedocs.io"
Repository = "https://github.com/yourusername/webrtc-enterprise"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
